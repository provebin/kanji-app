<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaaki Kanji OCR - Precision Pro v2</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100svh; background: #1a1a1a; color: white; overflow: hidden; }
        
        /* 비디오 및 가이드 박스 영역 */
        .camera-container { position: relative; flex: 1; width: 100%; background: black; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 조준창 (가이드 박스) */
        .guide-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 150px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* 박스 외곽 어둡게 */
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }
        .guide-box::after { content: "이 안에 한자를 맞추세요"; font-size: 12px; color: #00ff00; margin-top: 170px; }

        /* 결과 및 버튼 */
        #result { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; background: #1a1a1a; min-height: 60px; overflow-y: auto; justify-content: center; }
        .kanji-btn { padding: 10px 15px; font-size: 24px; border: none; border-radius: 8px; background: #ffffff; color: #333; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .kanji-btn:active { transform: scale(0.95); }
        
        .controls { padding: 15px 20px 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #2d2d2d; border-radius: 20px 20px 0 0; }
        button.action-btn { padding: 15px; font-size: 16px; border: none; border-radius: 12px; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        
        /* 분석 중 오버레이 */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; }
    </style>
</head>
<body>
    <div id="loading" class="overlay">
        <div>
            <strong style="font-size: 20px; color: #00ff00;">정밀 픽셀 이진화 분석 중...</strong><br><br>
            <span id="progress" style="font-size: 30px; font-weight: bold;">0%</span>
        </div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="guide-box"></div> <!-- 조준창 -->
    </div>

    <div id="result"></div>

    <div class="controls">
        <button class="action-btn" onclick="captureAndOCR()" style="background: #28a745;">🔍 정밀 추출 (Pro)</button>
        <button class="action-btn" onclick="startCamera()" style="background: #6c757d;">카메라 리셋</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // 향후 N5(103자), N4(181자) 데이터가 대량으로 주입될 핵심 DB 객체입니다.
        const KANJI_DB = {
            "宿": { "meaning": "숙소/잠잘 숙", "level": "N4", "on": "シュク", "kun": "やど", "story": "집(宀)에서 사람이 일백(百)번 잠을 자는 곳이 '숙소'입니다." },
            "泊": { "meaning": "머무를 박", "level": "N4", "on": "ハク", "kun": "とまり", "story": "물(氵)가에서 하얗게(白) 밤을 지새우며 배가 '머무는' 모습입니다." },
            "税": { "meaning": "세금 세", "level": "N3", "on": "ゼイ", "kun": "-", "story": "벼(禾)를 수확해서 기쁘게(兌) 바치는 것이 '세금'입니다." },
            "日": { "meaning": "날 일 / 해 일", "level": "N5", "on": "ニチ, ジツ", "kun": "ひ", "story": "[둥근 태양] + [가운데 흑점] = [해/날 日]. 태양의 모양을 본뜬 상형문자." },
            "一": { "meaning": "한 일", "level": "N5", "on": "イチ, イツ", "kun": "ひと", "story": "[손가락 하나] = [한 일 一]. 숫자 1을 나타내는 가로선 하나." }
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const progressText = document.getElementById('progress');
        const resultDiv = document.getElementById('result');

        window.onload = startCamera;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
            } catch (err) { alert("카메라 권한이 필요합니다. 브라우저 설정에서 카메라를 허용해 주세요."); }
        }

        async function captureAndOCR() {
            loading.style.display = 'flex';
            progressText.innerText = "화상 전처리 중...";
            const ctx = canvas.getContext('2d');
            
            // 1. 크롭(Crop) 계산: 비디오 상의 가이드 박스 위치 정밀 계산
            const scale = video.videoWidth / video.clientWidth;
            const cropW = 250 * scale;
            const cropH = 150 * scale;
            const cropX = (video.videoWidth - cropW) / 2;
            const cropY = (video.videoHeight - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;

            // 2. 캔버스에 가이드 박스 안의 원본 이미지만 잘라서 그리기
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            // ==========================================
            // [정밀 픽셀 이진화 엔진 가동 시작]
            // ==========================================
            const imageData = ctx.getImageData(0, 0, cropW, cropH);
            const data = imageData.data;
            const threshold = 110; // 임계값: 이 숫자가 높을수록 글자가 더 진해집니다.

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // 인간 눈의 밝기 인식을 반영한 명도 계산 공식
                const grayscale = 0.299 * r + 0.587 * g + 0.114 * b;
                
                // 명도가 110보다 밝으면 완전한 흰색(255), 어두우면 완전한 검은색(0)
                const color = grayscale > threshold ? 255 : 0;
                
                data[i] = color;     // Red
                data[i + 1] = color; // Green
                data[i + 2] = color; // Blue
            }
            
            // 노이즈가 제거된 흑백 데이터를 캔버스에 덮어쓰기
            ctx.putImageData(imageData, 0, 0);
            // ==========================================

            try {
                progressText.innerText = "0%";
                // Tesseract 엔진 가동
                const worker = await Tesseract.createWorker({
                    logger: m => { if(m.status === 'recognizing text') progressText.innerText = Math.round(m.progress * 100) + "%"; }
                });
                
                // jpn(가로쓰기) + jpn_vert(세로쓰기) 동시 탑재로 인식률 극대화
                await worker.loadLanguage('jpn+jpn_vert');
                await worker.initialize('jpn+jpn_vert');
                
                const { data: { text } } = await worker.recognize(canvas);
                await worker.terminate();
                
                loading.style.display = 'none';
                renderKanjis(text);
            } catch (error) {
                loading.style.display = 'none';
                alert("분석에 실패했습니다. 밝은 곳에서 다시 시도해 주세요.");
            }
        }

        function renderKanjis(text) {
            resultDiv.innerHTML = '';
            // 추출된 텍스트 중 한자(\u4e00-\u9faf)만 걸러냅니다.
            const kanjis = text.match(/[\u4e00-\u9faf]/g) || [];
            if (kanjis.length === 0) { 
                alert("인식된 한자가 없습니다. 조준창 중앙에 한자를 더 꽉 차게 맞춰주세요!"); 
                return; 
            }

            // 중복 한자를 제거(Set)하고 버튼으로 만들어 화면에 띄웁니다.
            [...new Set(kanjis)].forEach(kj => {
                const btn = document.createElement('button');
                btn.className = 'kanji-btn';
                btn.innerText = kj;
                
                // 한자 클릭 시 DB와 대조하여 정보 알림창 띄우기
                btn.onclick = () => {
                    if (KANJI_DB[kj]) {
                        alert(`【 ${kj} 】 : ${KANJI_DB[kj].meaning}\n\n💡 딥다이브 연상 스토리:\n${KANJI_DB[kj].story}`);
                    } else {
                        alert(`【 ${kj} 】 정보 준비 중...\n(아직 DB에 업데이트되지 않은 한자입니다)`);
                    }
                };
                resultDiv.appendChild(btn);
            });
        }
    </script>
</body>
</html>
