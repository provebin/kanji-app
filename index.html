<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Masaaki Kanji OCR - Precision Pro v3</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            max-height: 100vh;
            max-height: 100dvh;
            max-height: -webkit-fill-available;
            height: 100%;
            background: #121212;
            color: white;
            overflow: hidden;
            box-sizing: border-box;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* 뷰포트 영역 (카메라 & 캡처 화면) */
        .viewport-container {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .capture-view {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        .capture-view.is-active {
            display: block;
        }

        .capture-zoom-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
        }

        #cropCanvas {
            display: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: crosshair;
            touch-action: none;
        }

        /* 상태 안내 텍스트 */
        #status-text {
            position: absolute;
            top: max(20px, env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #00ff00;
            z-index: 10;
            font-weight: bold;
        }

        /* 추천 한자 패널 (접기/펼치기) */
        .result-panel {
            flex: 0 1 auto;
            flex-shrink: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-top: 1px solid #333;
            max-height: min(42vh, 38dvh);
            transition: max-height 0.28s ease;
        }

        .result-panel.collapsed {
            max-height: 46px;
        }

        .result-toggle {
            flex-shrink: 0;
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-bottom: 1px solid #333;
            background: #252525;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .result-toggle:active {
            background: #2f2f2f;
        }

        .result-toggle .chevron {
            font-size: 12px;
            opacity: 0.85;
            transition: transform 0.2s ease;
        }

        .result-panel.collapsed .result-toggle .chevron {
            transform: rotate(-90deg);
        }

        .result-inner {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px 14px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            justify-content: center;
            align-items: center;
        }

        .result-panel.collapsed .result-inner {
            display: none;
        }

        .kanji-btn {
            padding: 12px 20px;
            font-size: 26px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #121212;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .kanji-btn:active {
            transform: scale(0.95);
        }

        .controls {
            flex-shrink: 0;
            padding: 12px max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #2d2d2d;
            border-radius: 24px 24px 0 0;
        }

        button.action-btn {
            padding: 16px;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #btn-capture {
            background: #007bff;
            grid-column: span 2;
        }

        #btn-analyze {
            background: #28a745;
            display: none;
        }

        #btn-retake {
            background: #dc3545;
            display: none;
        }

        /* 분석 중 오버레이 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
        }

        .app-version {
            position: fixed;
            top: max(10px, env(safe-area-inset-top, 0px));
            left: max(10px, env(safe-area-inset-left, 0px));
            z-index: 11;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.42);
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <span id="app-version" class="app-version" aria-label="앱 버전"></span>
    <div id="loading" class="overlay">
        <div>
            <strong style="font-size: 20px; color: #00ff00;">정밀 분석 중...</strong><br><br>
            <span id="progress" style="font-size: 30px; font-weight: bold;">0%</span>
        </div>
    </div>

    <!-- 커스텀 모달 팝업 -->
    <div id="info-modal" class="overlay" style="display: none; z-index: 2000;" onclick="closeModal(event)">
        <div class="modal-content"
            style="background: #1e1e1e; padding: 24px; border-radius: 16px; width: 85%; max-width: 400px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;"
            onclick="event.stopPropagation()">
            <h2 id="modal-title" style="margin-top: 0; color: #00ff00; font-size: 28px; margin-bottom: 16px;"></h2>
            <div style="font-size: 15px; line-height: 1.6; color: #fff;">
                <p style="margin: 0 0 8px 0;"><span style="color: #aaa;">의미 :</span> <span id="modal-meaning"
                        style="font-weight: bold;"></span></p>
                <p style="margin: 0 0 8px 0;" id="modal-on-container"><span style="color: #aaa;">음독 :</span> <span
                        id="modal-on"></span></p>
                <p style="margin: 0 0 8px 0;" id="modal-kun-container"><span style="color: #aaa;">훈독 :</span> <span
                        id="modal-kun"></span></p>
                <p style="margin: 0 0 8px 0;" id="modal-comp-container"><span style="color: #aaa;">한자구성 :</span> <span
                        id="modal-comp"></span></p>
                <p style="margin: 0 0 4px 0;"><span style="color: #aaa;">한자해설 :</span></p>
                <p id="modal-story" style="margin: 0;"></p>
            </div>
            <div id="modal-link-container" style="margin-top: 20px; text-align: right;"></div>
            <button onclick="closeModal()" class="action-btn"
                style="width: 100%; background: #333; margin-top: 24px; padding: 12px; font-size: 16px;">닫기</button>
        </div>
    </div>

    <div class="viewport-container">
        <div id="status-text" style="color: #ffc107;">OCR 엔진 초기화 중... (잠시만 기다려주세요)</div>
        <video id="video" autoplay playsinline></video>
        <div id="capture-view" class="capture-view">
            <div id="capture-zoom-inner" class="capture-zoom-inner">
                <canvas id="cropCanvas"></canvas>
            </div>
        </div>
    </div>

    <div id="result-panel" class="result-panel">
        <button type="button" id="result-toggle" class="result-toggle" aria-expanded="true" aria-controls="result">
            <span>추천 한자</span>
            <span class="chevron" aria-hidden="true">▼</span>
        </button>
        <div id="result" class="result-inner" role="region" aria-label="인식된 한자 목록"></div>
    </div>

    <div class="controls">
        <button id="btn-capture" class="action-btn" onclick="takePhoto()">📸 사진 찍기</button>
        <button id="btn-analyze" class="action-btn" onclick="processSelection()">🔍 선택 영역 분석</button>
        <button id="btn-retake" class="action-btn" onclick="resetCamera()">🔄 다시 찍기</button>
    </div>

    <!-- OCR 처리를 위한 보이지 않는 캔버스 -->
    <canvas id="tessCanvas" style="display:none;"></canvas>

    <script>
        /** UI 표시용 — 코드 수정 시마다 패치 버전 올리기 */
        const APP_VERSION = 'V1.5';

        // 한자 DB
        const KANJI_DB = {
            "日": {
                "meaning": "날/해 일",
                "on": "ニチ、ジツ",
                "kun": "ひ、-か",
                "composition": "[네모난 태양] + [뿜어지는 빛 一]",
                "story": "'日(날 일)'은 둥근 태양과 퍼져나가는 빛을 그린 상형문자다. 거북 껍데기(갑골문)에 새길 때 곡선 표현이 어려워 지금의 네모난 형태로 굳어졌다. 기본적으로 '해', '날', '낮'을 뜻하며, 부수로 쓰일 때는 태양의 주기와 특성에 따라 '시간', '날짜', '밝기', '날씨' 등의 의미를 갖는다."
            },
            "月": {
                "meaning": "달 월",
                "on": "ゲツ、ガツ",
                "kun": "つき",
                "composition": "[초승달의 윤곽] + [구름 조각]",
                "story": "'月(달 월)'은 밤하늘에 뜬 초승달의 모양을 본뜬 상형문자다. 둥근 보름달 대신 굳이 초승달을 그린 이유는 둥근 해(日)와 구분하기 위해서다. 기본적으로 '달'을 뜻하며, 시간의 흐름에 따라 '달(month)'이나 '세월' 등의 의미로도 쓰인다."
            },
            "火": {
                "meaning": "불 화",
                "on": "カ",
                "kun": "ひ",
                "composition": "[타오르는 불꽃] + [사방으로 튀는 불똥]",
                "story": "'火(불 화)'는 장작불이 활활 타오르는 모습을 그린 상형문자다. 가운데는 위로 솟구치는 불꽃을, 양옆은 사방으로 튀는 불똥을 표현했다. 부수로 쓰일 때는 글자 아래에서 점 네 개(灬) 모양으로 바뀌며 '열기'나 '태우다'는 의미를 더한다."
            },
            "水": {
                "meaning": "물 수",
                "on": "スイ",
                "kun": "みず",
                "composition": "[흐르는 물줄기] + [양옆의 물방울]",
                "story": "'水(물 수)'는 시냇물이 바위를 부딪치며 굽이쳐 흐르는 모습을 그린 상형문자다. 가운데 굵은 선은 큰 물줄기를, 양옆은 튀어 오르는 물방울을 나타낸다. 부수로 쓰일 때는 글자 왼쪽(氵)이나 아래(氺)에 붙어 '액체', '흐름', '강'과 관련된 의미를 갖는다."
            },
            "木": {
                "meaning": "나무 목",
                "on": "モク、ボク",
                "kun": "き",
                "composition": "[위로 뻗은 가지] + [땅에 박힌 뿌리]",
                "story": "'木(나무 목)'은 흙에 단단히 뿌리내린 나무의 뼈대를 그린 상형문자다. 가로선은 위로 뻗은 나뭇가지를, 세로선은 굵은 기둥을, 양 갈래의 선은 땅속으로 파고든 뿌리를 표현했다. 부수로 쓰일 때는 '나무의 종류', '목재', '가구' 등의 의미를 전달한다."
            },
            "金": {
                "meaning": "쇠/돈 금",
                "on": "キン、コン",
                "kun": "かね",
                "composition": "[흙 土] + [반짝이는 사금 丷]",
                "story": "'金(쇠/돈 금)'은 땅속 깊은 곳에 묻혀 반짝이는 귀한 광물을 그린 글자다. 위쪽은 흙(土)과 덮개(亼)를 뜻하고, 아래의 점 두 개는 흙 속에 묻힌 사금이나 금괴를 의미한다. 귀한 금속에서 유래하여 현대에는 '돈', '화폐', '금속'의 뜻으로 널리 쓰인다."
            },
            "土": {
                "meaning": "흙 토",
                "on": "ド、ト",
                "kun": "つち",
                "composition": "[평평한 땅 一] + [돋아나는 새싹 十]",
                "story": "'土(흙 토)'는 비옥한 땅 위로 생명이 솟아나는 모습을 그린 글자다. 아래의 긴 가로선은 평평한 땅의 표면을, 그 위의 십자가 모양은 흙을 뚫고 나오는 흙무더기나 새싹을 표현했다. 부수로 쓰일 때는 '땅', '흙', '경계'와 관련된 의미를 갖는다."
            },
            "山": {
                "meaning": "뫼 산",
                "on": "サン",
                "kun": "やま",
                "composition": "[우뚝 솟은 세 개의 봉우리]",
                "story": "'山(뫼 산)'은 뾰족한 산봉우리가 나란히 솟아있는 모습을 본뜬 상형문자다. 가장 높은 주봉우리를 가운데 두고 양옆으로 낮은 봉우리들이 이어져 있는 웅장한 자연의 형태를 세 개의 세로선으로 단순하게 시각화했다."
            },
            "川": {
                "meaning": "내 천",
                "on": "セン",
                "kun": "かわ",
                "composition": "[굽이쳐 흐르는 세 줄기 물결]",
                "story": "'川(내 천)'은 강물이 일정한 방향으로 끊임없이 흘러가는 모양을 그린 상형문자다. 세 개의 세로선은 양쪽 강둑 사이로 물결이 굽이치며 도도하게 흘러가는 형태를 선으로 단순화한 것이다."
            },
            "雨": {
                "meaning": "비 우",
                "on": "ウ",
                "kun": "あめ",
                "composition": "[구름 덮인 하늘 冂] + [떨어지는 빗방울 ⠪]",
                "story": "'雨(비 우)'는 하늘에서 빗방울이 후둑후둑 떨어지는 모습을 그린 상형문자다. 위쪽의 덮개(冂)는 먹구름이 잔뜩 낀 하늘을 뜻하고, 안쪽의 점 4개는 구름에서 떨어지는 빗방울을 생동감 있게 표현했다. 부수로 쓰일 때는 '날씨'나 '기상 현상'을 의미한다."
            },
            "天": {
                "meaning": "하늘 천",
                "on": "テン",
                "kun": "あまつ",
                "composition": "[사람 大] + [머리 위 끝없는 공간 一]",
                "story": "'天(하늘 천)'은 사람이 서 있는 머리 꼭대기 위의 끝없는 하늘을 표현한 글자다. 팔다리를 뻗고 당당히 서 있는 사람(大)의 머리 위에 ㅡ자를 그어, 인간의 머리 위로 펼쳐진 가장 높고 넓은 공간을 시각화했다."
            },
            "空": {
                "meaning": "빌/하늘 공",
                "on": "クウ",
                "kun": "そら、あ.く",
                "composition": "[구멍 혈 穴] + [만드는 도구 工]",
                "story": "'空(빌 공)'은 동굴처럼 텅 비어 있는 공간을 뜻한다. 동굴을 뜻하는 구멍 혈(穴)에 도구를 뜻하는 장인 공(工)이 결합되어 '파내서 공간을 비우다'라는 뜻이 되었다. 텅 비어 끝없이 펼쳐진 공간이라는 의미에서 '하늘'을 뜻하게 되었다."
            },
            "気": {
                "meaning": "기운 기",
                "on": "キ、ケ",
                "kun": "-",
                "composition": "[숨결 气] + [뻗어나가는 에너지 乂]",
                "story": "'気(기운 기)'는 눈에 보이지 않지만 뿜어져 나오는 생명력이나 에너지를 뜻한다. 구름이 피어오르는 모양의 기운 기(气) 안에 쌀(米)이 끓으며 내는 밥의 수증기를 그렸으나, 일본어 상용한자에서는 안쪽이 메 산(乂) 모양으로 간략하게 줄어들었다."
            },
            "白": {
                "meaning": "흰 백",
                "on": "ハク、ビャク",
                "kun": "しろ、しろ.い",
                "composition": "[햇빛 日] + [살짝 내민 햇무리 丿]",
                "story": "'白(흰 백)'은 떠오르는 태양이 뿜어내는 밝고 하얀 빛을 그린 글자다. 해(日) 위로 삐져나온 짧은 획(丿)은 태양 주위로 퍼지는 햇무리를 표현한 것이다. 태양의 밝은 빛에서 유래하여 '하얗다', '밝다', '분명하다'라는 의미를 갖는다."
            },
            "人": { "meaning": "사람 인", "on": "ジン、ニン", "kun": "ひと", "composition": "[사람의 옆모습]", "story": "'人(사람 인)'은 두 발로 서서 걸어가는 사람의 옆모습을 그린 상형문자다." },
            "男": { "meaning": "사내 남", "on": "ダン、ナン", "kun": "おとこ", "composition": "[밭 田] + [힘 力]", "story": "'男(사내 남)'은 밭(田)에서 쟁기를 들고 힘(力)써 일하는 사람을 나타내어 '남자'를 뜻한다." },

        const video = document.getElementById('video');
        const cropCanvas = document.getElementById('cropCanvas');
        const tessCanvas = document.getElementById('tessCanvas');
        const ctx = cropCanvas.getContext('2d');
        const statusText = document.getElementById('status-text');

        const btnCapture = document.getElementById('btn-capture');
        const btnAnalyze = document.getElementById('btn-analyze');
        const btnRetake = document.getElementById('btn-retake');
        const resultDiv = document.getElementById('result');
        const resultPanel = document.getElementById('result-panel');
        const resultToggle = document.getElementById('result-toggle');
        const captureView = document.getElementById('capture-view');
        const captureZoomInner = document.getElementById('capture-zoom-inner');
        const appVersionEl = document.getElementById('app-version');
        if (appVersionEl) appVersionEl.textContent = APP_VERSION;

        let isDrawing = false;
        let startX, startY, currentX, currentY;
        let capturedImage = new Image();
        let hasSelection = false;
        let sel = null;
        let interactionMode = null;
        let resizeHandle = null;
        let resizeStartSel = null;
        let moveOffsetX = 0, moveOffsetY = 0;
        let moveStartSel = null;
        let boundPointerMove, boundPointerUp;

        let captureZoom = 1;
        let capturePanX = 0, capturePanY = 0;
        let pinchState = null;
        let boundPinchMove, boundPinchEnd;
        let ignoreTouchSelectionUntil = 0;

        function applyCaptureTransform() {
            captureZoomInner.style.transform = `translate(${capturePanX}px, ${capturePanY}px) scale(${captureZoom})`;
        }

        function resetCaptureViewTransform() {
            captureZoom = 1;
            capturePanX = capturePanY = 0;
            applyCaptureTransform();
        }

        function cancelInteractionForPinch() {
            if (interactionMode === 'move' && moveStartSel) sel = { ...moveStartSel };
            else if (interactionMode === 'resize' && resizeStartSel) sel = { ...resizeStartSel };
            isDrawing = false;
            interactionMode = null;
            resizeHandle = null;
            resizeStartSel = null;
            moveStartSel = null;
            detachGlobalPointer();
            paintSelectionLayer();
        }

        function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

        function attachPinchDocumentListeners() {
            detachPinchDocumentListeners();
            boundPinchMove = (ev) => { onPinchTouchMove(ev); };
            boundPinchEnd = (ev) => { onPinchTouchEnd(ev); };
            document.addEventListener('touchmove', boundPinchMove, { passive: false });
            document.addEventListener('touchend', boundPinchEnd);
            document.addEventListener('touchcancel', boundPinchEnd);
        }

        function detachPinchDocumentListeners() {
            if (!boundPinchMove) return;
            document.removeEventListener('touchmove', boundPinchMove);
            document.removeEventListener('touchend', boundPinchEnd);
            document.removeEventListener('touchcancel', boundPinchEnd);
            boundPinchMove = boundPinchEnd = null;
        }

        function onPinchTouchStart(e) {
            if (!captureView.classList.contains('is-active')) return;
            if (!e.touches || e.touches.length < 2) return;
            e.preventDefault();
            e.stopPropagation();
            cancelInteractionForPinch();
            const t0 = e.touches[0], t1 = e.touches[1];
            const dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
            const d0 = Math.hypot(dx, dy);
            if (d0 < 8) return;
            pinchState = {
                d0,
                z0: captureZoom,
                mid0: { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 },
                pan0: { x: capturePanX, y: capturePanY }
            };
            attachPinchDocumentListeners();
        }

        function onPinchTouchMove(e) {
            if (!pinchState || !e.touches || e.touches.length < 2) return;
            e.preventDefault();
            const t0 = e.touches[0], t1 = e.touches[1];
            const d = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
            const mid = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
            captureZoom = clamp(pinchState.z0 * (d / pinchState.d0), 1, 4);
            capturePanX = pinchState.pan0.x + (mid.x - pinchState.mid0.x);
            capturePanY = pinchState.pan0.y + (mid.y - pinchState.mid0.y);
            applyCaptureTransform();
        }

        function onPinchTouchEnd(e) {
            if (!pinchState) return;
            if (e.touches && e.touches.length >= 2) return;
            detachPinchDocumentListeners();
            pinchState = null;
            ignoreTouchSelectionUntil = Date.now() + 220;
        }

        let tesseractScheduler = null;
        let isWorkersReady = false;

        async function initTesseract() {
            tesseractScheduler = Tesseract.createScheduler();
            const NUM_WORKERS = 4; // 4개의 워커로 8개 작업을 병렬 처리 (모바일 성능 고려)
            const workerPromises = [];

            for (let i = 0; i < NUM_WORKERS; i++) {
                workerPromises.push((async () => {
                    const worker = await Tesseract.createWorker();
                    await worker.loadLanguage('jpn+jpn_vert');
                    await worker.initialize('jpn+jpn_vert');
                    await worker.setParameters({
                        tessedit_pageseg_mode: '11',
                        user_defined_dpi: '280'
                    });
                    tesseractScheduler.addWorker(worker);
                })());
            }
            await Promise.all(workerPromises);
            isWorkersReady = true;

            // 만약 캡처 화면으로 넘어가지 않고 카메라 화면이라면 텍스트 복구
            if (statusText.innerText.includes("초기화 중")) {
                statusText.innerText = "카메라로 한자를 비춰주세요";
                statusText.style.color = "#00ff00";
            }
        }

        window.onload = () => {
            initTesseract(); // 백그라운드에서 워커 생성 시작
            startCamera();
            resultToggle.addEventListener('click', () => {
                const collapsed = resultPanel.classList.toggle('collapsed');
                resultToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            });
            captureView.addEventListener('touchstart', onPinchTouchStart, { passive: false, capture: true });
            captureView.addEventListener('wheel', (e) => {
                if (!captureView.classList.contains('is-active') || !e.ctrlKey) return;
                e.preventDefault();
                const dz = e.deltaY > 0 ? -0.08 : 0.08;
                captureZoom = clamp(captureZoom + dz, 1, 4);
                applyCaptureTransform();
            }, { passive: false });
        };

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                video.srcObject = stream;
            } catch (err) { alert("카메라 권한이 필요합니다."); }
        }

        // 1단계: 사진 찍기
        function takePhoto() {
            cropCanvas.width = video.videoWidth;
            cropCanvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, cropCanvas.width, cropCanvas.height);
            capturedImage.src = cropCanvas.toDataURL('image/png');

            video.style.display = 'none';
            captureView.classList.add('is-active');
            cropCanvas.style.display = 'block';
            resetCaptureViewTransform();

            btnCapture.style.display = 'none';
            btnAnalyze.style.display = 'flex';
            btnRetake.style.display = 'flex';

            statusText.innerText = "손가락으로 영역 지정 · 두 손가락으로 확대/축소 (Ctrl+휠)";
            statusText.style.color = "#ffc107";
            resultDiv.innerHTML = '';
            hasSelection = false;
            sel = null;
            paintSelectionLayer();
        }

        // 2단계: 다시 찍기
        function resetCamera() {
            detachPinchDocumentListeners();
            pinchState = null;
            captureView.classList.remove('is-active');
            cropCanvas.style.display = 'none';
            resetCaptureViewTransform();
            video.style.display = 'block';

            btnCapture.style.display = 'flex';
            btnAnalyze.style.display = 'none';
            btnRetake.style.display = 'none';

            statusText.innerText = "카메라로 한자를 비춰주세요";
            statusText.style.color = "#00ff00";
            hasSelection = false;
            sel = null;
            detachGlobalPointer();
        }

        // --- 터치 및 마우스: 영역 지정 / 이동 / 핸들 리사이즈 ---
        function getClientXY(e) {
            if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function getPos(e) {
            const rect = cropCanvas.getBoundingClientRect();
            const c = getClientXY(e);
            const scaleX = cropCanvas.width / rect.width;
            const scaleY = cropCanvas.height / rect.height;
            return { x: (c.x - rect.left) * scaleX, y: (c.y - rect.top) * scaleY };
        }

        function dist2(ax, ay, bx, by) {
            const dx = ax - bx, dy = ay - by;
            return dx * dx + dy * dy;
        }

        function distPointToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len2 = dx * dx + dy * dy || 1;
            let t = ((px - x1) * dx + (py - y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const qx = x1 + t * dx, qy = y1 + t * dy;
            return Math.hypot(px - qx, py - qy);
        }

        function handleRadius() {
            return Math.max(18, Math.min(cropCanvas.width, cropCanvas.height) * 0.028);
        }

        function hitHandle(px, py, r) {
            const pad = handleRadius();
            const d2 = pad * pad;
            const corners = [
                ['nw', r.x, r.y], ['ne', r.x + r.w, r.y],
                ['se', r.x + r.w, r.y + r.h], ['sw', r.x, r.y + r.h]
            ];
            for (const [name, hx, hy] of corners) {
                if (dist2(px, py, hx, hy) <= d2) return name;
            }
            const edges = [
                ['n', r.x, r.y, r.x + r.w, r.y],
                ['e', r.x + r.w, r.y, r.x + r.w, r.y + r.h],
                ['s', r.x + r.w, r.y + r.h, r.x, r.y + r.h],
                ['w', r.x, r.y + r.h, r.x, r.y]
            ];
            for (const [name, x1, y1, x2, y2] of edges) {
                if (distPointToSegment(px, py, x1, y1, x2, y2) <= pad) return name;
            }
            if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return 'inside';
            return null;
        }

        function normalizeRect(ax, ay, bx, by) {
            const x = Math.min(ax, bx), y = Math.min(ay, by);
            const w = Math.abs(bx - ax), h = Math.abs(by - ay);
            return { x, y, w, h };
        }

        function clampRect(r) {
            const cw = cropCanvas.width, ch = cropCanvas.height;
            let { x, y, w, h } = r;
            const minS = 8;
            x = Math.max(0, Math.min(x, cw - minS));
            y = Math.max(0, Math.min(y, ch - minS));
            w = Math.max(minS, Math.min(w, cw - x));
            h = Math.max(minS, Math.min(h, ch - y));
            return { x, y, w, h };
        }

        function applyResizePointer(handle, r0, px, py) {
            let r;
            switch (handle) {
                case 'se': r = normalizeRect(r0.x, r0.y, px, py); break;
                case 'nw': r = normalizeRect(px, py, r0.x + r0.w, r0.y + r0.h); break;
                case 'ne': r = normalizeRect(r0.x, r0.y + r0.h, px, py); break;
                case 'sw': r = normalizeRect(r0.x + r0.w, r0.y, px, py); break;
                case 'e': r = normalizeRect(r0.x, r0.y, px, r0.y + r0.h); break;
                case 'w': r = normalizeRect(px, r0.y, r0.x + r0.w, r0.y + r0.h); break;
                case 'n': r = normalizeRect(r0.x, py, r0.x + r0.w, r0.y + r0.h); break;
                case 's': r = normalizeRect(r0.x, r0.y, r0.x + r0.w, py); break;
                default: r = { ...r0 };
            }
            return clampRect(r);
        }

        function getDisplayRect() {
            if (interactionMode === 'create' && isDrawing) {
                return normalizeRect(startX, startY, currentX, currentY);
            }
            if (sel) return { ...sel };
            return null;
        }

        function paintSelectionLayer() {
            if (!capturedImage.complete || capturedImage.naturalWidth === 0) return;
            ctx.drawImage(capturedImage, 0, 0, cropCanvas.width, cropCanvas.height);
            const r = getDisplayRect();
            if (!r || r.w < 2 || r.h < 2) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
            ctx.fillRect(r.x, r.y, r.w, r.h);

            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.strokeRect(r.x, r.y, r.w, r.h);

            if (hasSelection && sel && !(interactionMode === 'create' && isDrawing)) {
                drawResizeHandles(r);
            }
        }

        function drawResizeHandles(r) {
            const hr = Math.max(10, handleRadius() * 0.55);
            const pts = [
                [r.x, r.y], [r.x + r.w / 2, r.y], [r.x + r.w, r.y],
                [r.x + r.w, r.y + r.h / 2], [r.x + r.w, r.y + r.h],
                [r.x + r.w / 2, r.y + r.h], [r.x, r.y + r.h], [r.x, r.y + r.h / 2]
            ];
            ctx.fillStyle = '#00ff00';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.lineWidth = 1;
            for (const [hx, hy] of pts) {
                ctx.beginPath();
                ctx.rect(hx - hr, hy - hr, hr * 2, hr * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        function detachGlobalPointer() {
            if (!boundPointerMove) return;
            document.removeEventListener('mousemove', boundPointerMove);
            document.removeEventListener('mouseup', boundPointerUp);
            document.removeEventListener('touchmove', boundPointerMove);
            document.removeEventListener('touchend', boundPointerUp);
            boundPointerMove = boundPointerUp = null;
        }

        function attachGlobalPointer() {
            detachGlobalPointer();
            boundPointerMove = (ev) => { onPointerMove(ev); };
            boundPointerUp = (ev) => { onPointerUp(ev); };
            document.addEventListener('mousemove', boundPointerMove);
            document.addEventListener('mouseup', boundPointerUp);
            document.addEventListener('touchmove', boundPointerMove, { passive: false });
            document.addEventListener('touchend', boundPointerUp);
        }

        function onPointerDown(e) {
            if (cropCanvas.style.display !== 'block') return;
            if (e.touches && e.touches.length >= 2) return;
            if (e.touches && Date.now() < ignoreTouchSelectionUntil) return;
            e.preventDefault();
            const pos = getPos(e);
            const hit = hasSelection && sel ? hitHandle(pos.x, pos.y, sel) : null;

            if (hit && hit !== 'inside') {
                interactionMode = 'resize';
                resizeHandle = hit;
                resizeStartSel = { ...sel };
            } else if (hit === 'inside') {
                interactionMode = 'move';
                moveStartSel = { ...sel };
                moveOffsetX = pos.x - sel.x;
                moveOffsetY = pos.y - sel.y;
            } else {
                interactionMode = 'create';
                isDrawing = true;
                startX = currentX = pos.x;
                startY = currentY = pos.y;
                hasSelection = false;
                sel = null;
            }
            attachGlobalPointer();
            paintSelectionLayer();
        }

        function onPointerMove(e) {
            if (!interactionMode) return;
            e.preventDefault();
            const pos = getPos(e);
            if (interactionMode === 'create' && isDrawing) {
                currentX = pos.x;
                currentY = pos.y;
            } else if (interactionMode === 'move' && sel) {
                let nx = pos.x - moveOffsetX;
                let ny = pos.y - moveOffsetY;
                nx = Math.max(0, Math.min(nx, cropCanvas.width - sel.w));
                ny = Math.max(0, Math.min(ny, cropCanvas.height - sel.h));
                sel = { ...sel, x: nx, y: ny };
            } else if (interactionMode === 'resize' && resizeStartSel) {
                sel = applyResizePointer(resizeHandle, resizeStartSel, pos.x, pos.y);
            }
            paintSelectionLayer();
        }

        function onPointerUp(e) {
            e.preventDefault();
            if (interactionMode === 'create' && isDrawing) {
                isDrawing = false;
                const r0 = normalizeRect(startX, startY, currentX, currentY);
                if (r0.w < 8 || r0.h < 8) {
                    sel = null;
                    hasSelection = false;
                } else {
                    sel = clampRect(r0);
                    hasSelection = true;
                }
            } else if (interactionMode === 'resize' || interactionMode === 'move') {
                if (sel) sel = clampRect(sel);
                hasSelection = !!(sel && sel.w >= 8 && sel.h >= 8);
                if (!hasSelection) sel = null;
            }
            interactionMode = null;
            resizeHandle = null;
            resizeStartSel = null;
            moveStartSel = null;
            detachGlobalPointer();
            paintSelectionLayer();
        }

        function updateHoverCursor(e) {
            if (cropCanvas.style.display !== 'block' || !sel || interactionMode) {
                cropCanvas.style.cursor = 'crosshair';
                return;
            }
            const pos = getPos(e);
            const h = hitHandle(pos.x, pos.y, sel);
            const map = {
                nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
                n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
                inside: 'move'
            };
            cropCanvas.style.cursor = map[h] || 'crosshair';
        }

        cropCanvas.addEventListener('mousedown', onPointerDown);
        cropCanvas.addEventListener('mousemove', updateHoverCursor);
        cropCanvas.addEventListener('touchstart', onPointerDown, { passive: false });

        capturedImage.onload = () => {
            if (cropCanvas.style.display === 'block') paintSelectionLayer();
        };

        /** 좌·우 가장자리의 세로 괄호/세로 막대(잉크 비율 높은 열)를 흰색으로 — [皮] 등에서 괄호 간섭 완화 */
        function suppressBracketColumns(imageData, iw, ih) {
            const data = imageData.data;
            const n = iw * ih;
            const gray = new Uint8Array(n);
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                gray[i] = (0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2]) | 0;
            }
            const strip = Math.max(2, Math.min(28, Math.ceil(iw * 0.16)));
            const ink = (g) => (g < 215 ? 1 : 0);
            function colRatio(cx) {
                let s = 0;
                for (let y = 0; y < ih; y++) s += ink(gray[y * iw + cx]);
                return s / ih;
            }
            function paintCol(cx) {
                for (let y = 0; y < ih; y++) {
                    const p = (y * iw + cx) * 4;
                    data[p] = data[p + 1] = data[p + 2] = 255;
                    data[p + 3] = 255;
                }
            }
            for (let cx = 0; cx < Math.min(strip, iw); cx++) {
                if (colRatio(cx) > 0.48) paintCol(cx);
            }
            for (let cx = Math.max(0, iw - strip); cx < iw; cx++) {
                if (colRatio(cx) > 0.48) paintCol(cx);
            }
        }

        /** 그라데이션·컬러 글자에 강한 max(R,G,B) 기반 그레이 + 스트레치 */
        function buildStretchedMaxChannel(imageData) {
            const { data, width: iw, height: ih } = imageData;
            const n = iw * ih;
            const gray = new Uint8Array(n);
            let min = 255, max = 0;
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                const g = Math.max(data[p], data[p + 1], data[p + 2]);
                gray[i] = g;
                if (g < min) min = g;
                if (g > max) max = g;
            }
            const range = max - min || 1;
            for (let i = 0; i < n; i++) {
                gray[i] = (((gray[i] - min) / range) * 255) | 0;
            }
            return gray;
        }

        /** 히스토그램 평활화 — 그라데이션 대비 펴기 */
        function equalizeGrayInPlace(gray, len) {
            const hist = new Uint32Array(256);
            for (let i = 0; i < len; i++) hist[gray[i]]++;
            const cdf = new Uint32Array(256);
            cdf[0] = hist[0];
            for (let i = 1; i < 256; i++) cdf[i] = cdf[i - 1] + hist[i];
            let lo = 0;
            for (; lo < 256; lo++) if (cdf[lo] > 0) break;
            const denom = len - cdf[lo];
            if (denom <= 0) return;
            for (let i = 0; i < len; i++) {
                gray[i] = (((cdf[gray[i]] - cdf[lo]) * 255) / denom) | 0;
            }
        }

        /** 밝은 획/연한 글자용 역이진 */
        function binarizeWithOtsuInverted(imageData, gray) {
            const thr = otsuThreshold(gray, gray.length);
            const data = imageData.data;
            for (let i = 0; i < gray.length; i++) {
                const v = gray[i] > thr ? 0 : 255;
                const p = i * 4;
                data[p] = data[p + 1] = data[p + 2] = v;
                data[p + 3] = 255;
            }
        }

        /** 획 단절 보완 (3×3 팽창 후 침식 1회) */
        function morphCloseBinary3(imageData, iw, ih) {
            const data = imageData.data;
            const n = iw * ih;
            const ink = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                const p = i * 4;
                ink[i] = data[p] < 128 ? 1 : 0;
            }
            const tmp = new Uint8Array(n);
            for (let y = 0; y < ih; y++) {
                for (let x = 0; x < iw; x++) {
                    let m = 0;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < iw && ny >= 0 && ny < ih) {
                                m = Math.max(m, ink[ny * iw + nx]);
                            }
                        }
                    }
                    tmp[y * iw + x] = m;
                }
            }
            for (let y = 0; y < ih; y++) {
                for (let x = 0; x < iw; x++) {
                    let m = 1;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < iw && ny >= 0 && ny < ih) {
                                m = Math.min(m, tmp[ny * iw + nx]);
                            }
                        }
                    }
                    const v = m ? 0 : 255;
                    const p = (y * iw + x) * 4;
                    data[p] = data[p + 1] = data[p + 2] = v;
                    data[p + 3] = 255;
                }
            }
        }

        /** 그레이스케일 + 히스토그램 스트레치 (조명·반사 편차 완화) */
        function buildStretchedGrayscale(imageData) {
            const { data, width: iw, height: ih } = imageData;
            const n = iw * ih;
            const gray = new Uint8Array(n);
            let min = 255, max = 0;
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                const g = (0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2]) | 0;
                gray[i] = g;
                if (g < min) min = g;
                if (g > max) max = g;
            }
            const range = max - min || 1;
            for (let i = 0; i < n; i++) {
                gray[i] = (((gray[i] - min) / range) * 255) | 0;
            }
            return gray;
        }

        /** Otsu 자동 임계값 (고정 110보다 간판·메뉴에 유리) */
        function otsuThreshold(gray, len) {
            const hist = new Uint32Array(256);
            for (let i = 0; i < len; i++) hist[gray[i]]++;
            let sum = 0;
            for (let i = 0; i < 256; i++) sum += i * hist[i];
            let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
            for (let t = 0; t < 256; t++) {
                wB += hist[t];
                if (wB === 0) continue;
                const wF = len - wB;
                if (wF === 0) break;
                sumB += t * hist[t];
                const mB = sumB / wB;
                const mF = (sum - sumB) / wF;
                const between = wB * wF * (mB - mF) * (mB - mF);
                if (between >= maxVar) {
                    maxVar = between;
                    threshold = t;
                }
            }
            return threshold;
        }

        function binarizeWithOtsu(imageData, gray) {
            const thr = otsuThreshold(gray, gray.length);
            const data = imageData.data;
            for (let i = 0; i < gray.length; i++) {
                const v = gray[i] > thr ? 255 : 0;
                const p = i * 4;
                data[p] = data[p + 1] = data[p + 2] = v;
                data[p + 3] = 255;
            }
        }

        function writeGrayToRgba(imageData, gray) {
            const data = imageData.data;
            for (let i = 0; i < gray.length; i++) {
                const v = gray[i];
                const p = i * 4;
                data[p] = data[p + 1] = data[p + 2] = v;
                data[p + 3] = 255;
            }
        }

        /** 짧은 변 기준 업스케일 + 흰 여백 */
        function scalePadOnto(binCanvas, sw, sh, outCanvas) {
            const minSide = Math.min(sw, sh);
            const targetMin = 176;
            let scale = 1;
            if (minSide < targetMin) {
                scale = Math.min(4, targetMin / minSide);
            }
            const scaledW = Math.max(1, Math.round(sw * scale));
            const scaledH = Math.max(1, Math.round(sh * scale));
            const pad = Math.max(16, Math.round(Math.min(scaledW, scaledH) * 0.12));
            const tCtx = outCanvas.getContext('2d');
            outCanvas.width = scaledW + pad * 2;
            outCanvas.height = scaledH + pad * 2;
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            tCtx.imageSmoothingEnabled = false;
            tCtx.drawImage(binCanvas, 0, 0, sw, sh, pad, pad, scaledW, scaledH);
        }

        /**
         * variant: gray | gray_bracket | maxGray | eqGray_bracket | otsu_bracket | otsu_inv | otsu_close_bracket
         * 괄호·그라데이션 대응: 가장자리 열 제거 / max채널 / 평활화 / 이진·역이진·closing
         */
        function prepareOcrVariant(sourceImage, sx, sy, sw, sh, outCanvas, variant) {
            if (sw < 1 || sh < 1) return false;
            const work = document.createElement('canvas');
            work.width = sw;
            work.height = sh;
            const wctx = work.getContext('2d');
            wctx.drawImage(sourceImage, sx, sy, sw, sh, 0, 0, sw, sh);
            const imageData = wctx.getImageData(0, 0, sw, sh);
            if (variant.endsWith('_bracket')) {
                suppressBracketColumns(imageData, sw, sh);
            }
            const base = variant.replace(/_bracket$/, '');

            if (base === 'gray') {
                const gray = buildStretchedGrayscale(imageData);
                writeGrayToRgba(imageData, gray);
            } else if (base === 'maxGray') {
                const gray = buildStretchedMaxChannel(imageData);
                writeGrayToRgba(imageData, gray);
            } else if (base === 'eqGray') {
                const gray = buildStretchedGrayscale(imageData);
                equalizeGrayInPlace(gray, gray.length);
                writeGrayToRgba(imageData, gray);
            } else if (base === 'otsu') {
                const gray = buildStretchedGrayscale(imageData);
                binarizeWithOtsu(imageData, gray);
            } else if (base === 'otsu_inv') {
                const gray = buildStretchedGrayscale(imageData);
                binarizeWithOtsuInverted(imageData, gray);
            } else if (base === 'otsu_close') {
                const gray = buildStretchedGrayscale(imageData);
                binarizeWithOtsu(imageData, gray);
                morphCloseBinary3(imageData, sw, sh);
            } else {
                return false;
            }
            wctx.putImageData(imageData, 0, 0);
            scalePadOnto(work, sw, sh, outCanvas);
            return true;
        }

        const OCR_VARIANTS = [
            'gray',
            'gray_bracket',
            'maxGray',
            'maxGray_bracket',
            'eqGray_bracket',
            'otsu_bracket',
            'otsu_inv',
            'otsu_close_bracket'
        ];

        // 3단계: 선택 영역 전처리 및 OCR 분석
        async function processSelection() {
            if (!hasSelection || !sel) { alert("먼저 손가락으로 드래그하여 한자 영역을 선택해주세요!"); return; }

            document.getElementById('loading').style.display = 'flex';
            document.getElementById('progress').innerText = "영역 추출 중...";

            const x = sel.x;
            const y = sel.y;
            const w = sel.w;
            const h = sel.h;

            if (w < 8 || h < 8) {
                document.getElementById('loading').style.display = 'none';
                alert("영역이 너무 작습니다. 글자를 조금 더 넓게 드래그해 주세요.");
                return;
            }
            if (!capturedImage.complete || capturedImage.naturalWidth === 0) {
                document.getElementById('loading').style.display = 'none';
                alert("캡처 이미지를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
                return;
            }

            if (!isWorkersReady) {
                document.getElementById('loading').style.display = 'none';
                alert("OCR 엔진이 아직 초기화 중입니다. 몇 초 뒤에 다시 시도해 주세요.");
                return;
            }

            try {
                document.getElementById('progress').innerText = "0%";
                const totalJobs = OCR_VARIANTS.length;
                let completedJobs = 0;

                const jobs = [];
                for (let i = 0; i < totalJobs; i++) {
                    // 병렬 처리를 위해 각각 독립적인 캔버스 생성
                    const tempCanvas = document.createElement('canvas');
                    const success = prepareOcrVariant(capturedImage, x, y, w, h, tempCanvas, OCR_VARIANTS[i]);

                    if (success) {
                        const job = tesseractScheduler.addJob('recognize', tempCanvas).then(res => {
                            completedJobs++;
                            document.getElementById('progress').innerText = `${Math.round((completedJobs / totalJobs) * 100)}%`;
                            return res.data.text || '';
                        });
                        jobs.push(job);
                    }
                }

                const results = await Promise.all(jobs);
                const mergedText = results.join('\n');

                document.getElementById('loading').style.display = 'none';
                renderKanjis(mergedText);
            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                alert("분석 실패. 다른 이미지를 시도해 주세요.");
            }
        }

        function closeModal(e) {
            document.getElementById('info-modal').style.display = 'none';
        }

        function showKanjiModal(kj) {
            const modal = document.getElementById('info-modal');
            const titleEl = document.getElementById('modal-title');
            const meaningEl = document.getElementById('modal-meaning');
            const onEl = document.getElementById('modal-on');
            const kunEl = document.getElementById('modal-kun');
            const compEl = document.getElementById('modal-comp');
            const storyEl = document.getElementById('modal-story');

            const onContainer = document.getElementById('modal-on-container');
            const kunContainer = document.getElementById('modal-kun-container');
            const compContainer = document.getElementById('modal-comp-container');
            const linkContainer = document.getElementById('modal-link-container');

            titleEl.innerText = `【 ${kj} 】`;

            if (KANJI_DB[kj]) {
                const db = KANJI_DB[kj];
                meaningEl.innerText = db.meaning || "";

                if (db.on) {
                    onEl.innerText = db.on;
                    onContainer.style.display = "block";
                } else {
                    onContainer.style.display = "none";
                }

                if (db.kun) {
                    kunEl.innerText = db.kun;
                    kunContainer.style.display = "block";
                } else {
                    kunContainer.style.display = "none";
                }

                if (db.composition) {
                    compEl.innerText = db.composition;
                    compContainer.style.display = "block";
                } else {
                    compContainer.style.display = "none";
                }

                storyEl.innerText = db.story || "";

                if (db.link) {
                    linkContainer.innerHTML = `<a href="${db.link}" target="_blank" style="color: #4da6ff; text-decoration: underline; font-weight: bold; font-size: 16px;">[상세정보]</a>`;
                } else {
                    linkContainer.innerHTML = '';
                }
            } else {
                meaningEl.innerText = "정보 준비 중...";
                onContainer.style.display = "none";
                kunContainer.style.display = "none";
                compContainer.style.display = "none";
                storyEl.innerText = "아직 DB에 업데이트되지 않은 한자입니다.";
                linkContainer.innerHTML = '';
            }

            modal.style.display = 'flex';
        }

        function renderKanjis(text) {
            resultDiv.innerHTML = '';
            resultPanel.classList.remove('collapsed');
            resultToggle.setAttribute('aria-expanded', 'true');
            const kanjis = text.match(/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g) || [];
            if (kanjis.length === 0) {
                alert("인식된 한자가 없습니다. 영역을 글자에 딱 맞게 다시 지정해주세요!");
                return;
            }

            [...new Set(kanjis)].forEach(kj => {
                const btn = document.createElement('button');
                btn.className = 'kanji-btn';
                btn.innerText = kj;
                btn.onclick = () => {
                    showKanjiModal(kj);
                };
                resultDiv.appendChild(btn);
            });
        }
    </script>
