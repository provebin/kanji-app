<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaaki Kanji OCR - Precision Pro</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100svh; background: #1a1a1a; color: white; overflow: hidden; }
        
        /* 비디오 및 가이드 박스 영역 */
        .camera-container { position: relative; flex: 1; width: 100%; background: black; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 조준창 (가이드 박스) */
        .guide-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 150px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* 박스 외곽 어둡게 */
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }
        .guide-box::after { content: "이 안에 한자를 맞추세요"; font-size: 12px; color: #00ff00; margin-top: 170px; }

        /* 결과 및 버튼 */
        #result { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; background: #1a1a1a; min-height: 60px; overflow-y: auto; justify-content: center; }
        .kanji-btn { padding: 10px 15px; font-size: 24px; border: none; border-radius: 8px; background: #ffffff; color: #333; font-weight: bold; }
        
        .controls { padding: 15px 20px 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #2d2d2d; border-radius: 20px 20px 0 0; }
        button { padding: 15px; font-size: 16px; border: none; border-radius: 12px; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        
        /* 분석 중 오버레이 */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; justify-content: center; align-items: center; z-index: 1000; text-align: center; }
    </style>
</head>
<body>
    <div id="loading" class="overlay"><div><strong style="font-size: 20px;">중앙 영역 정밀 분석 중...</strong><br><span id="progress">0%</span></div></div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="guide-box"></div> <!-- 조준창 추가 -->
    </div>

    <div id="result"></div>

    <div class="controls">
        <button onclick="captureAndOCR()" style="background: #28a745;">🔍 조준 영역 추출</button>
        <button onclick="startCamera()" style="background: #6c757d;">카메라 리셋</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const KANJI_DB = {
            "宿": { "meaning": "숙소/잠잘 숙", "level": "N4", "on": "シュク", "kun": "やど", "story": "집(宀)에서 사람이 일백(百)번 잠을 자는 곳이 '숙소'입니다." },
            "泊": { "meaning": "머무를 박", "level": "N4", "on": "ハク", "kun": "とまり", "story": "물(氵)가에서 하얗게(白) 밤을 지새우며 배가 '머무는' 모습입니다." },
            "税": { "meaning": "세금 세", "level": "N3", "on": "ゼ이", "kun": "-", "story": "벼(禾)를 수확해서 기쁘게(兌) 바치는 것이 '세금'입니다." }
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const progressText = document.getElementById('progress');
        const resultDiv = document.getElementById('result');

        window.onload = startCamera;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
            } catch (err) { alert("카메라 권한 필요"); }
        }

        async function captureAndOCR() {
            loading.style.display = 'flex';
            const ctx = canvas.getContext('2d');
            
            // 1. 크롭(Crop) 계산: 비디오 상의 가이드 박스 위치 계산
            const scale = video.videoWidth / video.clientWidth;
            const cropW = 250 * scale;
            const cropH = 150 * scale;
            const cropX = (video.videoWidth - cropW) / 2;
            const cropY = (video.videoHeight - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;

            // 1. 일단 잘라낸 영상을 캔버스에 있는 그대로 그립니다 (필터 없음).
ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

// 2. 캔버스의 모든 픽셀 데이터를 긁어옵니다. (R, G, B, Alpha 값이 1열로 늘어선 거대한 배열)
const imageData = ctx.getImageData(0, 0, cropW, cropH);
const data = imageData.data;

// 3. 이진화 임계값(Threshold) 설정 (0~255)
// 빛 반사나 그림자에 따라 조절 가능합니다. 숫자가 높을수록 글자가 더 두꺼워지고 검어집니다.
const threshold = 110; 

// 4. 수만 개의 픽셀을 0.01초 만에 해부하여 강제 흑백 처리합니다.
for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];
    
    // 인간의 눈이 인식하는 밝기 공식에 따라 현재 픽셀의 명도를 계산합니다.
    const grayscale = 0.299 * r + 0.587 * g + 0.114 * b;
    
    // 명도가 임계값보다 밝으면 완전한 흰색(255), 어두우면(글자면) 완전한 검은색(0)으로 덮어씁니다.
    const color = grayscale > threshold ? 255 : 0;
    
    data[i] = color;     // Red
    data[i + 1] = color; // Green
    data[i + 2] = color; // Blue
    // data[i+3]은 투명도(Alpha)이므로 그대로 둡니다.
}

// 5. 조작이 완료된 순백/칠흑 데이터를 캔버스에 다시 꽂아 넣습니다.
ctx.putImageData(imageData, 0, 0);
            
            try {
                const worker = await Tesseract.createWorker({
                    logger: m => { if(m.status === 'recognizing text') progressText.innerText = Math.round(m.progress * 100) + "%"; }
                });
                await worker.loadLanguage('jpn');
                await worker.initialize('jpn');
                const { data: { text } } = await worker.recognize(canvas);
                await worker.terminate();
                
                loading.style.display = 'none';
                renderKanjis(text);
            } catch (error) {
                loading.style.display = 'none';
                alert("분석 실패");
            }
        }

        function renderKanjis(text) {
            resultDiv.innerHTML = '';
            const kanjis = text.match(/[\u4e00-\u9faf]/g) || [];
            if (kanjis.length === 0) { alert("중앙 박스 안에 한자를 더 크게 맞춰주세요!"); return; }

            [...new Set(kanjis)].forEach(kj => {
                const btn = document.createElement('button');
                btn.className = 'kanji-btn';
                btn.innerText = kj;
                btn.onclick = () => alert(KANJI_DB[kj] ? `${kj}: ${KANJI_DB[kj].meaning}` : `${kj} 정보 준비중`);
                resultDiv.appendChild(btn);
            });
        }
    </script>
</body>
</html>
